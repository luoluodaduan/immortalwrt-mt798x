name: Build U-Boot AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu libssl-dev \
            qemu-user-static bc python3 python3-pyelftools
          sudo apt-get -yqq autoremove --purge
          sudo apt-get -yqq clean

      - name: Build U-Boot AX6000
        run: |
          git clone --depth=1 https://github.com/hanwckf/bl-mt798x.git
          cd bl-mt798x
          SOC=mt7986 BOARD=redmi_ax6000 MULTI_LAYOUT=1 ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Redmi_AX6000_U-Boot
          path: bl-mt798x/output/

      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 0
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 1
          gh_token: ${{ secrets.GITHUB_TOKEN }}
